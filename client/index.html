<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROM - Simulador God Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b1d2e; font-family: 'Courier New', Courier, monospace; color: white; user-select: none; transition: filter 2s ease-in-out; }
        
        .dark-age-filter {
            filter: sepia(0.8) hue-rotate(-20deg) brightness(0.6) contrast(1.2);
        }
        
        #map-container { width: 100vw; height: 100vh; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0b1d2e; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #1a4a6e;
            border-top: 5px solid #00ddff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hud-panel { position: absolute; background: rgba(10, 20, 35, 0.85); border: 2px solid #222; border-radius: 4px; padding: 15px; }
    </style>
</head>
<body>
    <!-- Tela de Carregamento -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h1 style="color: #00ddff; letter-spacing: 2px;">CROM: Inicializando Matriz</h1>
        <p style="color: #aaa; margin-top: 10px;">Gerando centenas de milhares de hexágonos celulares...</p>
    </div>

    <!-- Painel Deus (Menu Inicial) -->
    <div id="god-panel" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(11, 29, 46, 0.95); z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center;">
        <div class="stone-panel" style="width: 500px; padding: 30px; text-align: center; box-shadow: 0 0 30px #00ddff;">
            <h1 style="color: #00ddff; margin-bottom: 5px;">PAINEL DA CRIAÇÃO</h1>
            <p style="color: #aaa; margin-bottom: 25px; font-size: 18px;">Defina as leis da física deste novo Universo.</p>
            
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color: #e0d0a0; font-size: 18px;">🔥 Probabilidade de Guerra (<span id="val-war">5%</span>/mês)</label>
                <input type="range" id="config-war" min="1" max="20" value="5" style="width: 100%;">
                <small style="color: #666;">Taxa de agressividade base das facções.</small>
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color: #e0d0a0; font-size: 18px;">☄️ Limite do "Great Filter" (<span id="val-disaster">95%</span> poluição)</label>
                <input type="range" id="config-disaster" min="50" max="200" value="95" style="width: 100%;">
                <small style="color: #666;">Quanto o planeta aguenta antes do Colapso Global.</small>
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="color: #e0d0a0; font-size: 18px;">💡 Custo de Evolução (<span id="val-tech">1x</span>)</label>
                <input type="range" id="config-tech" min="0.5" max="3.0" step="0.1" value="1.0" style="width: 100%;">
                <small style="color: #666;">Multiplicador do custo de DNA das Tecnologias.</small>
            </div>

            <button id="btn-start-universe" style="background: #2d6b35; color: white; border: none; padding: 15px 30px; font-size: 24px; font-family: 'VT323'; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 10px;">GERAR UNIVERSO</button>
        </div>
    </div>

    <div id="game-container">
        <!-- Canvas de Alta Performance (Fundo) -->
        <canvas id="map-canvas" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></canvas>

        <!-- Canvas do Mapa (SVG Sobreposto) -->
        <div id="worldCanvas" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 2;"></div>

        <!-- UI injetada dinamicamente pelo UIManager.js -->
    </div>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
